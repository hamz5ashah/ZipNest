name: Build

# Builds every ZipNest deliverable (Windows installer + portable ZIPs, Android APK,
# Linux CLI) on each push and pull request. Pushing a tag like "v1.5.0" also
# publishes a GitHub Release with the files attached.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of android/buildtools/debug-signing.p12
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   MSIX_KEY_BASE64            base64 of installer/signing/zipnest-msix.key
#   MSIX_CERT_BASE64           base64 of installer/signing/zipnest-msix.pem
# Without them (e.g. pull requests from forks) the build still runs, but with
# temporary throw-away keys, so those files must not be published.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nsis gcc-mingw-w64-x86-64 osslsigncode

      - name: Cache Android build jars
        uses: actions/cache@v4
        with:
          path: android/buildtools/cache
          key: android-buildtools-${{ hashFiles('android/buildtools/fetch_tools.sh') }}

      - name: Restore signing keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MSIX_KEY_BASE64: ${{ secrets.MSIX_KEY_BASE64 }}
          MSIX_CERT_BASE64: ${{ secrets.MSIX_CERT_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/buildtools/debug-signing.p12
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK is signed with a temporary key"
          fi
          if [ -n "$MSIX_KEY_BASE64" ] && [ -n "$MSIX_CERT_BASE64" ]; then
            mkdir -p installer/signing
            echo "$MSIX_KEY_BASE64" | base64 -d > installer/signing/zipnest-msix.key
            echo "$MSIX_CERT_BASE64" | base64 -d > installer/signing/zipnest-msix.pem
            chmod 600 installer/signing/zipnest-msix.key
          else
            echo "::warning::MSIX_KEY_BASE64 / MSIX_CERT_BASE64 are not set - a temporary certificate is used"
          fi

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./build.sh

      - name: Remove signing keys
        if: always()
        run: rm -f android/buildtools/debug-signing.p12 installer/signing/zipnest-msix.key

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ZipNest-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.apk
            dist/zipnest-linux-amd64
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.apk
            dist/zipnest-linux-amd64
